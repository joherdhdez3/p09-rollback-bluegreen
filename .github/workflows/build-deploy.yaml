name: Build and Deploy to AWS

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  backend-build:
    name: Build and Push Backend Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar credenciales AWS via OIDC
        if: github.event_name != 'pull_request'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Autenticar Docker con ECR
        if: github.event_name != 'pull_request'
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build y push de la imagen Backend
        if: github.event_name != 'pull_request'
        env:
          BACKEND_ECR_REGISTRY: ${{ vars.BACKEND_ECR_REGISTRY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -t $BACKEND_ECR_REGISTRY:$IMAGE_TAG \
            -t $BACKEND_ECR_REGISTRY:latest \
            ./backend/.
          docker push $BACKEND_ECR_REGISTRY:$IMAGE_TAG
          docker push $BACKEND_ECR_REGISTRY:latest

      - name: Build local de la imagen Backend (validación PR)
        if: github.event_name == 'pull_request'
        run: |
          docker build -t backend:pr ./backend/.

      - name: Escribir summary del job (Backend)
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          echo "## Resumen del job - Backend" >> $GITHUB_STEP_SUMMARY
          echo "- Job: ${GITHUB_JOB}" >> $GITHUB_STEP_SUMMARY
          echo "- Status: ${JOB_STATUS}" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: ${GITHUB_SHA}" >> $GITHUB_STEP_SUMMARY
          echo "- Image tag: ${IMAGE_TAG}" >> $GITHUB_STEP_SUMMARY
  
  frontend-build:
    name: Build Frontend Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar credenciales AWS via OIDC
        if: github.event_name != 'pull_request'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Autenticar Docker con ECR
        if: github.event_name != 'pull_request'
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build y push de la imagen Frontend
        if: github.event_name != 'pull_request'
        env:
          FRONTEND_ECR_REGISTRY: ${{ vars.FRONTEND_ECR_REGISTRY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -t $FRONTEND_ECR_REGISTRY:$IMAGE_TAG \
            -t $FRONTEND_ECR_REGISTRY:latest \
            ./frontend/.
          docker push $FRONTEND_ECR_REGISTRY:$IMAGE_TAG
          docker push $FRONTEND_ECR_REGISTRY:latest

      - name: Build local de la imagen Frontend (validación PR)
        if: github.event_name == 'pull_request'
        run: |
          docker build -t frontend:pr ./frontend/.
      
      - name: Escribir summary del job (Frontend)
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          echo "## Resumen del job - Frontend" >> $GITHUB_STEP_SUMMARY
          echo "- Job: ${GITHUB_JOB}" >> $GITHUB_STEP_SUMMARY
          echo "- Status: ${JOB_STATUS}" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: ${GITHUB_SHA}" >> $GITHUB_STEP_SUMMARY
          echo "- Image tag: ${IMAGE_TAG}" >> $GITHUB_STEP_SUMMARY
  
  deploy:
    name: Deploy to AWS
    if: github.event_name != 'pull_request'
    needs:
      - backend-build
      - frontend-build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar credenciales AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Escribir la versión en el artefacto
        run: |
          echo "${{ github.sha }}" > .app-version

      - name: Verificar estructura
        run: |
          echo "--- Raíz ---"
          ls -la
          echo "--- Scripts ---"
          ls -la scripts || true

      - name: Preparar script de arranque con variables del workflow
        env:
          DEPLOY_AWS_REGION: ${{ vars.AWS_REGION }}
          DEPLOY_ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}
          DEPLOY_APP_VERSION: ${{ github.sha }}
        run: |
          cat > scripts/start_app.sh <<EOF
          #!/bin/bash
          set -euo pipefail

          APP_VERSION="\${APP_VERSION:-${DEPLOY_APP_VERSION}}"
          export APP_VERSION

          cd /opt/mi-app

          AWS_REGION="\${AWS_REGION:-${DEPLOY_AWS_REGION}}"
          export AWS_REGION

          detect_instance_ip() {
            local token=""
            local instance_ip=""

            if command -v curl >/dev/null 2>&1; then
              token="\$(curl -fsS --connect-timeout 1 --max-time 2 \\
                -X PUT \\
                -H 'X-aws-ec2-metadata-token-ttl-seconds: 300' \\
                'http://169.254.169.254/latest/api/token' || true)"

              if [[ -n "\$token" ]]; then
                instance_ip="\$(curl -fsS --connect-timeout 1 --max-time 2 \\
                  -H "X-aws-ec2-metadata-token: \$token" \\
                  'http://169.254.169.254/latest/meta-data/local-ipv4' || true)"
              fi
            fi

            if [[ -z "\$instance_ip" ]]; then
              instance_ip="\$(hostname -I | awk '{print \$1}')"
            fi

            printf '%s' "\$instance_ip"
          }

          INSTANCE_IP="\${INSTANCE_IP:-\$(detect_instance_ip)}"
          export INSTANCE_IP

          ECR_REGISTRY="\${ECR_REGISTRY:-${DEPLOY_ECR_REGISTRY}}"
          if [[ -z "\${ECR_REGISTRY}" ]]; then
            ACCOUNT_ID="\$(aws sts get-caller-identity --query Account --output text)"
            ECR_REGISTRY="\${ACCOUNT_ID}.dkr.ecr.\${AWS_REGION}.amazonaws.com"
          fi
          export ECR_REGISTRY

          aws ecr get-login-password --region "\$AWS_REGION" | \
            docker login --username AWS --password-stdin \
            "\$ECR_REGISTRY"

          COMPOSE_FILE="\${COMPOSE_FILE:-docker-compose.yml}"
          export COMPOSE_FILE

          docker compose -f "\$COMPOSE_FILE" pull
          docker compose -f "\$COMPOSE_FILE" down --remove-orphans
          docker compose -f "\$COMPOSE_FILE" up -d
          docker image prune -f
          EOF
          chmod +x scripts/start_app.sh

      - name: Empaquetar y subir a S3
        id: s3_push
        env:
          S3_KEY: releases/${{ github.sha }}.zip
        run: |
          aws deploy push \
            --application-name "${{ vars.CODEDEPLOY_APP }}" \
            --s3-location "s3://${{ vars.S3_BUCKET }}/${S3_KEY}" \
            --source .

          S3_VERSION_ID="$(aws s3api head-object \
            --bucket "${{ vars.S3_BUCKET }}" \
            --key "${S3_KEY}" \
            --query 'VersionId' --output text)"

          if [[ -z "$S3_VERSION_ID" || "$S3_VERSION_ID" == "None" ]]; then
            echo "::error::No se obtuvo VersionId del objeto S3 releases/${{ github.sha }}.zip. Verifica que el bucket ${{ vars.S3_BUCKET }} tenga versioning activado."
            exit 1
          fi

          echo "s3_key=${S3_KEY}" >> "$GITHUB_OUTPUT"
          echo "s3_version_id=${S3_VERSION_ID}" >> "$GITHUB_OUTPUT"

      - name: Crear deployment en CodeDeploy
        env:
          S3_KEY: ${{ steps.s3_push.outputs.s3_key }}
          S3_VERSION_ID: ${{ steps.s3_push.outputs.s3_version_id }}
        run: |
          aws deploy create-deployment \
            --application-name "${{ vars.CODEDEPLOY_APP }}" \
            --deployment-group-name "${{ vars.CODEDEPLOY_GROUP }}" \
            --s3-location "bucket=${{ vars.S3_BUCKET }},key=${S3_KEY},bundleType=zip,version=${S3_VERSION_ID}" \
            --description "Deploy commit ${{ github.sha }}"

      - name: Escribir summary del job (Deploy)
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          S3_VERSION_ID: ${{ steps.s3_push.outputs.s3_version_id }}
        run: |
          echo "## Resumen del job - Deploy" >> "$GITHUB_STEP_SUMMARY"
          echo "- Job: ${GITHUB_JOB}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Status: ${JOB_STATUS}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit desplegado: ${GITHUB_SHA}" >> "$GITHUB_STEP_SUMMARY"
          echo "- S3 VersionId: ${S3_VERSION_ID:-N/A}" >> "$GITHUB_STEP_SUMMARY"
